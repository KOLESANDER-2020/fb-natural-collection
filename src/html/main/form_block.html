<section class="form_block">
	<div class="container">
		<h2 class="form_block_title title_h2">
			Support the project
		</h2>
		<p class="form_block_description">
			Our collection grows thanks to&nbsp;people who care about nature. Leave your name and e-mail to&nbsp;hear about new expeditions, volunteer days and exhibitions, or&nbsp;to&nbsp;help&nbsp;us catalogue and preserve rare specimens for the&nbsp;museum archive.
		</p>
		<form class="form_block_form" id="form_block_js" action="#" method="post">
			<div class="form-group form-group-name">
				<input  class="form_block_input" type="text" name="name" placeholder="Name"
				data-pristine-required-message="This field is required" required>
			</div>
			<div class="form-group form-group-mail">
				<input class="form_block_input" type="email" name="email" id="email" placeholder="Email" data-pristine-required-message="Please enter your e-mail" data-pristine-email-message="Please enter a valid e-mail"  required>
			</div>
			<button type="submit" class="form_block_button button_green">Send</button>
		</form>
	</div>

</section>
